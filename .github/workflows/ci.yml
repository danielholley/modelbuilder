name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, for the PrismML format drift check
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  # The training side, plus an end-to-end run through the Rust binary
  # (fixture target → `modelbuilder job mtp-align` → GGUF sidecar).
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo build -p modelbuilder
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e "python[dev,hf]"
      - run: ruff check python && ruff format --check python
      - run: pytest -q python/tests
        env:
          MODELBUILDER_BIN: ${{ github.workspace }}/target/debug/modelbuilder

  # The React dashboard. Its API types are generated from Rust; the `test`
  # job's mb-server `types` test fails when web/src/api/types.ts is stale.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Re-derives the PQ2_0/PTQ1_0 golden vectors from the current PrismML fork.
  # A diff means the fork changed its block format; see
  # docs/research/prismml-quant-formats.md.
  prism-format-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git clone --depth 1 https://github.com/PrismML-Eng/llama.cpp "$RUNNER_TEMP/prism-llama.cpp"
      - run: scripts/prism-golden.sh "$RUNNER_TEMP/prism-llama.cpp"
      - name: Compare vectors (ignoring the commit line)
        run: git diff --exit-code -I '^// Generated by' -- crates/mb-formats/src/dequant_golden.rs
