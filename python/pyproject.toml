[project]
name = "modelbuilder-train"
version = "0.1.0"
description = "Training and probes for modelbuilder: runs job specs emitted by the Rust side"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2", "numpy", "safetensors"]

[project.optional-dependencies]
# PyTorch is heavy: install it for your platform (CUDA, ROCm, CPU or MPS) as described
# at https://pytorch.org, or use this extra for the default build.
torch = ["torch>=2.2"]
# The `trunk_distill` stage and HF probes (attention interface, `dtype=` loading).
hf = ["transformers>=4.56", "safetensors"]
dev = ["pytest", "ruff", "jsonschema"]

[project.scripts]
modelbuilder-train = "modelbuilder_train.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modelbuilder_train*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
