[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
mb-ir = { path = "crates/mb-ir" }
mb-formats = { path = "crates/mb-formats" }
mb-analyze = { path = "crates/mb-analyze" }
mb-fixtures = { path = "crates/mb-fixtures" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
