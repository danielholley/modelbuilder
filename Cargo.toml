[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
mb-ir = { path = "crates/mb-ir" }
mb-formats = { path = "crates/mb-formats" }
mb-analyze = { path = "crates/mb-analyze" }
mb-features = { path = "crates/mb-features" }
mb-fixtures = { path = "crates/mb-fixtures" }
mb-jobs = { path = "crates/mb-jobs" }
mb-plan = { path = "crates/mb-plan" }
mb-surgery = { path = "crates/mb-surgery" }
mb-api = { path = "crates/mb-api" }
mb-server = { path = "crates/mb-server" }
mb-tui = { path = "crates/mb-tui" }
anyhow = "1"
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
memmap2 = "0.9"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
toml = "0.9"
# ratatui 0.30 needs Rust 1.86; 0.29 keeps the 1.85 MSRV.
ratatui = "0.29"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
